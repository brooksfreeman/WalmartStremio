<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Owner TV Lab</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/hello.js" defer></script>
</head>
<body>
  <main>
    <p class="eyebrow">OWNER TV LAB · PAGE TEST</p>
    <h1>Your screen. Your remote.</h1>
    <p>This temporary page tests the TV browser and remote.</p>
    <p>Use the arrow keys to move. Press OK to select a color.</p>
    <nav aria-label="Test controls">
      <button data-color="blue" autofocus>Blue</button>
      <button data-color="green">Green</button>
      <button data-color="orange">Orange</button>
      <button id="home">Return Home</button>
    </nav>
    <output id="status" aria-live="polite">Ready for the remote</output>
    <p class="hint">Home on the physical remote should leave this page. Back/Escape also requests Home.</p>
  </main>
</body>
</html>
